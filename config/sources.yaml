# All news sources for scripts/fetch_news.py, in one place.
#
# Every feed URL below was checked by hand (HTTP 200 + valid RSS/Atom) on
# 2026-09-23. Never add a URL without checking it first.
#
# Per-source fields:
#   id               short unique name, used in data/status.json
#   name             label shown on the website
#   url              the RSS/Atom feed
#   karma_threshold  (LessWrong / Alignment Forum only) the script adds
#                    `karmaThreshold=<n>` to the URL, so the site only sends
#                    posts that reached that karma
#   require_topic    true = keep an entry only if it matches at least one topic
#                    keyword below (for general sources that also post off-topic)
#   default_topics   topics every entry of this source gets, on top of the
#                    keyword matches (for single-topic sources)
#   enabled          optional; `false` = paused: not fetched and not listed on
#                    About (say why in a comment). Remove it to reactivate.
#   crossposts       true = this source publishes the same posts as other
#                    sources marked `crossposts`, under different URLs. Only
#                    between two such sources is an entry with the same title
#                    (normalised, 4+ words) treated as a duplicate. Mark a source
#                    only after seeing a real cross-post in the data.
#
# Order matters for cross-posts: the same post can be on the Alignment Forum and
# on LessWrong. The first source that sees it keeps it, so AF goes first, and
# Zvi's blog goes before LessWrong too.

settings:
  user_agent: "AiSafetyWeb/1.0 (+https://marcobm1.github.io/AiSafetyWeb/)"
  timeout_seconds: 30
  # Ignore entries older than this. Protects against feeds that return their
  # whole history (OpenAI's has 1,000+ items) the first time we read them.
  max_age_days: 14

sources:
  - id: alignment-forum
    name: AI Alignment Forum
    url: https://www.alignmentforum.org/feed.xml?view=community-rss
    crossposts: true   # seen: Redwood posts also published here
    karma_threshold: 20

  - id: zvi
    name: Don't Worry About the Vase
    # Zvi's WordPress copy of the same posts; thezvi.substack.com/feed answers
    # 403 to GitHub Actions. Checked from Actions on 2026-09-23.
    url: https://thezvi.wordpress.com/feed/
    # seen: his posts also on LessWrong ("Politics Gets Interested In Those
    # Trying Not To Die", "Claude Opus 5.5: The System Card"). Before
    # LessWrong so that his blog's copy is the one kept.
    crossposts: true
    require_topic: true

  - id: lesswrong
    name: LessWrong
    url: https://www.lesswrong.com/feed.xml?view=community-rss
    crossposts: true   # same posts as the AF (and its cross-posts)
    karma_threshold: 30
    require_topic: true

  - id: transformer-circuits
    name: Transformer Circuits Thread (Anthropic)
    url: https://transformer-circuits.pub/feed.xml
    default_topics: [interpretability]

  - id: ai-safety-newsletter
    name: AI Safety Newsletter (CAIS)
    url: https://newsletter.safe.ai/feed   # CAIS's Substack, on its own domain

  - id: metr
    name: METR
    url: https://metr.org/feed.xml
    crossposts: true   # seen: a joint post also on Redwood's blog

  - id: redwood
    name: Redwood Research
    # Its own domain: redwoodresearch.substack.com redirects here, and the
    # *.substack.com feed answers 403 to GitHub Actions (Substack blocks
    # data-centre addresses). Checked from Actions on 2026-09-23.
    url: https://blog.redwoodresearch.org/feed
    crossposts: true   # seen: posts also on the AF, and one on METR's blog

  - id: govai
    name: Centre for the Governance of AI
    url: https://www.governance.ai/post/rss.xml
    require_topic: true   # the feed also carries job postings

  - id: transformer
    name: Transformer
    url: https://www.transformernews.ai/feed
    require_topic: true

  - id: import-ai
    name: Import AI
    # Jack Clark's own site, where importai.net redirects; same issues as the
    # Substack. importai.substack.com/feed answers 403 to GitHub Actions.
    # Checked from Actions on 2026-09-23.
    url: https://jack-clark.net/feed/

  - id: epoch
    name: Epoch AI
    # PAUSED (2026-09-24): Substack answers 403 to GitHub Actions, and epoch.ai
    # has no feed of its own (no <link rel="alternate">, nothing in its
    # sitemaps; /rss.xml, /feed.xml, /atom.xml, /blog/rss.xml... are 404; its
    # newsletter page points to Substack). To reactivate: find a feed that
    # works, test it from Actions (Run workflow → check_feed), put it in `url`
    # and delete `enabled: false`. HOW_THIS_SITE_WORKS §5.3 and §11.
    url: https://epochai.substack.com/feed
    enabled: false
    require_topic: true

  - id: bluedot
    name: BlueDot Impact
    url: https://blog.bluedot.org/feed
    require_topic: true

  - id: openai
    name: OpenAI News
    url: https://openai.com/news/rss.xml
    require_topic: true

  - id: google-deepmind
    name: Google DeepMind
    # DeepMind's own blog feed (checked from GitHub Actions on 2026-09-23 with
    # fetch_news.py --check-feed). It fails only from my work network; until
    # Stage 8 I used https://blog.google/technology/google-deepmind/rss/.
    url: https://deepmind.google/blog/rss.xml
    require_topic: true

# arXiv: one API request per run (see https://info.arxiv.org/help/api/tou.html).
# The query searches titles and abstracts in cs.AI, cs.LG and cs.CL for any of
# the `phrases`, or for all the terms of any `combinations` entry together.
# Plain "interpretability" is not used on its own: arXiv matches word stems
# (interpretable, interpretation...) and it returned ~195 papers a week, mostly
# generic explainability. Measured on 2026-09-15..22: interpretability AND
# safety = 12/week (mostly noise), AND alignment = 33 (noise: "cross-modal
# alignment"...), so those were left out too.
# Plain "misalignment" was removed on 2026-09-24 for the same reason: in papers
# it often means misaligned sensors, images, channels or data. Measured on the
# real week 2026-09-16..22: the old query returned 64 papers (31 relevant to AI
# Safety, 4 doubtful, 29 not); this one returns 45 (the same 31 relevant, plus
# one more relevant paper; 2 doubtful, 11 not). No relevant paper was lost.
# A check of every saved arXiv entry (2026-09-13..23) found two relevant
# papers only the old "misalignment" had caught (CoT-monitoring evasion,
# inoculation training), so the three CoT-monitoring phrases and the
# [inoculation, language model] combination were added for them.
arxiv:
  enabled: true
  categories: [cs.AI, cs.LG, cs.CL]
  phrases:
    - AI safety
    - AI alignment
    - mechanistic interpretability
    - sparse autoencoder
    - reward hacking
    - red teaming
    - jailbreak
    - deceptive alignment
    - scalable oversight
    - dangerous capabilities
    - sandbagging
    - alignment faking
    - emergent misalignment
    - agentic misalignment
    - AI misalignment
    - misaligned AI
    - misaligned model
    - model misalignment
    - goal misgeneralization
    - chain-of-thought monitoring
    - chain of thought monitoring
    - CoT monitoring
    - AI control
    - AI governance
    - frontier AI
    - catastrophic risk
    - specification gaming
  combinations:           # every term must appear (title or abstract)
    - [interpretability, AI safety]
    - [interpretability, AI alignment]
    - [interpretability, deception]
    - [interpretability, deceptive]
    - [misalignment, AI agent]
    - [misalignment, human values]
    - [inoculation, language model]
  max_results: 100
  pause_seconds: 3      # arXiv asks for at least 3 s between requests
  # Stricter topic keywords for arXiv papers only (they replace the lists in
  # `topics:` below for this source). In the blogs "alignment" means AI
  # alignment; in papers it often means aligning images, sensors or data, so
  # here it only counts in an AI sense. A list = all its terms must appear.
  # Measured on 2026-09-16..22: papers tagged Alignment went from 32 (18 not
  # about AI Safety) to 11 (2 borderline). Relevant papers that lost the tag
  # kept their other topics.
  topic_overrides:
    alignment:
      - AI safety
      - AI alignment
      - alignment research*
      - alignment problem
      - alignment faking
      - alignment tax
      - superalignment
      - safety alignment
      - value alignment
      - aligned AI
      - misaligned AI
      - misaligned model*
      - misaligned agent*
      - misaligned LLM*
      - misaligned checkpoint*
      - AI misalignment
      - model misalignment
      - emergent misalignment
      - emergent-misalign*
      - agentic misalignment
      - goal misgeneralization
      - [alignment, RLHF]
      - [alignment, human values]
      - [alignment, human preferences]
      - [alignment, reward model*]
      - [misalign*, AI agent*]
      - reward hacking
      - RLHF
      - constitutional AI
      - scalable oversight
      - deceptive alignment
      - deceptive behavio*
      - strategic deception
      - scheming
      - sycophan*
      - specification gaming
      - AI control
      - corrigib*
      - sandbagging
      - superintelligen*
      - AGI
      - x-risk
      - existential risk
      - loss of control

# Paper candidates (data/paper_candidates.json): new arXiv papers I might add
# to the Library. Candidates older than this are deleted on every run.
candidates:
  retention_days: 60

# Topics are assigned by keyword, case insensitive, in the title and the first
# 600 characters of the text.
# A keyword matches whole words only ("AGI" does not match "agile"). A trailing
# * allows any ending: "misalign*" matches misaligned, misalignment...
# Keep keywords specific: "policy" alone would match every reinforcement-learning paper.
topics:
  alignment:
    - AI safety
    - alignment
    - misalign*
    - reward hacking
    - RLHF
    - constitutional AI
    - scalable oversight
    - deceptive
    - deception
    - scheming
    - sycophan*
    - specification gaming
    - AI control
    - corrigib*
    - sandbagging
    - superintelligen*
    - AGI
    - x-risk
    - existential risk
    - loss of control
  interpretability:
    - interpretability
    - mechanistic
    - sparse autoencoder*
    - circuit*
    - probing
    - activation steering
    - chain-of-thought monitor*
    - chain of thought monitor*
    - CoT monitor*
  evals:
    - eval
    - evals
    - evaluation*
    - benchmark*
    - red team*
    - red-team*
    - dangerous capabilit*
    - system card*
    - preparedness
    - uplift
    - METR
  governance:
    - governance
    - AI policy
    - regulat*
    - legislat*
    - AI Act
    - executive order*
    - export control*
    - compute threshold*
    - treaty
    - treaties
    - AI Security Institute
    - AI Safety Institute
    - frontier AI
  security:
    - jailbreak*
    - prompt injection*
    - adversarial
    - security
    - cyber*
    - model weights
    - exfiltrat*
    - backdoor*
    - data poisoning
    - biosecurity
    - bioweapon*
    - misuse

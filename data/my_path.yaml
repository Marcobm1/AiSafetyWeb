# My Own Path: my public learning log (courses, papers, articles, projects,
# milestones). The website shows it as a timeline, newest first.
# Full format and a step-by-step guide: docs/HOW_THIS_SITE_WORKS.md.
#
# Fields:
#   date       YYYY-MM-DD when I started (or when it happened, for a milestone)
#   completed  YYYY-MM-DD when I finished (optional)
#   type       course | paper | article | project | milestone
#   title, url                 omit both if the entry uses `ref`
#   provider   for courses (e.g. BlueDot Impact)
#   author     for texts not in the Library
#   ref        id of an entry in data/library.yaml (title, authors and URL come
#              from there, so I don't repeat them)
#   status     in-progress | completed
#   notes      my takeaways, in first person

